# Static site for schierer.org. Included inside the http {} block of the
# nginx-unprivileged image. TLS terminates at the load balancer in front of
# this container, so it only speaks plain HTTP on 8080.

# Trust X-Forwarded-For from the load balancer (private VPC addresses only)
# so rate limiting keys on the real client address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_user_agent $limit_key {
  default        $binary_remote_addr;
  ~*LinkChecker  "";
  ~*Googlebot    "";
  ~*bingbot      "";
}
limit_req_zone $limit_key zone=anti_hammer:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=security_scan:10m rate=1r/m;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html index.htm;
  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  limit_req zone=anti_hammer burst=10 nodelay;
  limit_req_status 429;

  # Load balancer health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Block OpenAI crawlers.
  if ($http_referer ~* (openai\.com)) {
    return 444;
  }

  # Block suspicious query strings.
  if ($args ~* (union.*select|concat.*\(|base64_|javascript:|<script)) {
    return 444;
  }

  # Common scanner targets. Nothing like this exists on the site; slow the
  # scanners down. PHP is stripped at build time, this is belt and braces.
  location ~* (/\.|wp-admin|phpMyAdmin|/admin|\.php[0-9]?$|\.phtml$|\.asp$|\.inc$|\.tpl$) {
    limit_req zone=security_scan burst=1 nodelay;
    limit_req_status 444;
    return 404;
  }

  # Luke's pages moved to their own host. Keep deep links working.
  location = /~luke {
    return 301 https://luke.schierer.org/$is_args$args;
  }
  location ~ ^/~luke(/.*)$ {
    return 301 https://luke.schierer.org$1$is_args$args;
  }

  # Some of Ann's poems are HTML files without an .html extension.
  location ^~ /~ann/poems/ {
    default_type text/html;
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Google Analytics, injected into every HTML page (archives included)
  # without editing the archived files.
  sub_filter_types text/html;
  sub_filter_once on;
  sub_filter '</head>' '<script async src="https://www.googletagmanager.com/gtag/js?id=G-27HN1KJGR3"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-27HN1KJGR3");</script></head>';
}
